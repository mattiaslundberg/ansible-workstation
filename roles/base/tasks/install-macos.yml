---
- name: Install core CLI packages
  homebrew:
    name:
      - git
      - coreutils
      - curl
    state: present
  environment:
    PATH: /opt/homebrew/bin:/usr/local/bin:{{ ansible_env.PATH }}
  tags: [minimal]

- name: Install Karabiner-Elements
  homebrew_cask:
    name: karabiner-elements
    state: present
    accept_external_apps: yes
  environment:
    PATH: /opt/homebrew/bin:/usr/local/bin:{{ ansible_env.PATH }}
  tags: [minimal, karabiner, keyboard]

- name: Create custom brew cache
  become: yes
  file:
    state: directory
    path: /opt/HomebrewCache
    owner: mattias

- name: Install base packages
  homebrew:
    name:
      - zsh # Changing shell
      - curl # Installing
      - luarocks # Spacehammer/fennel
    state: present

- name: Restore all packages
  command: brew bundle --file=Brewfile
  tags: [brew, extra]


- name: Add brew zsh as allowed shell
  become: yes
  template:
    src: templates/shells.j2
    dest: /etc/shells
  tags: [zsh]

- name: Set loginshell
  become: true
  shell: chsh -s /opt/homebrew/bin/zsh
  tags: [zsh]
