---
- name: Ensure ~/.config exists
  file:
    path: ~/.config
    state: directory
  tags: [karabiner, keyboard, minimal]

- name: Check karabiner config path
  stat:
    path: ~/.config/karabiner
  register: karabiner_config
  tags: [karabiner, keyboard, minimal]

- name: Remove default Karabiner config directory
  file:
    path: ~/.config/karabiner
    state: absent
  when: karabiner_config.stat.exists | default(false) and not karabiner_config.stat.islnk | default(false)
  tags: [karabiner, keyboard, minimal]

- name: Symlink karabiner config
  file:
    state: link
    src: ~/.dotfiles/.config/karabiner
    dest: ~/.config/karabiner
  tags: [karabiner, keyboard, minimal]

- name: Symlink spacehammer config
  file:
    state: link
    src: "~/.dotfiles/.spacehammer"
    dest: "~/.spacehammer"
  tags: [spacehammer]

- name: Clone spacehammer repo
  git:
    dest: ~/.hammerspoon
    repo: "git@github.com:agzam/spacehammer.git"
    recursive: yes
    accept_hostkey: yes
    update: yes
  ignore_errors: yes
  tags: [spacehammer]

- name: Install fennel
  command: luarocks install --local fennel
  args:
    creates: ~/.luarocks/bin/fennel
  tags: [spacehammer]
